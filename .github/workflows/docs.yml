name: Documentation

# Builds the Sphinx site from doc/ (strict, -W) and publishes it on GitHub Pages.
# Pages uses the "GitHub Actions" source: the built HTML is uploaded as an
# artifact, so the site does not need to live in a docs/ folder of a branch.
# - pull requests: build only, so that a broken page is caught before merging;
# - push to main, published release, manual run: build and deploy.
on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "doc/**"
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            doc/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build of PyTorch: the documentation never uses a GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
          # yetanotherspdnet (Tyler / Student-t estimators of the tutorials, not on PyPI)
          pip install -r doc/requirements.txt

      - name: Build Sphinx documentation (strict)
        env:
          # no dataset in the CI: only the tutorials (synthetic data) are executed
          SPDNET_DATA_ROOT: /nonexistent
          MPLBACKEND: Agg
        run: make -C doc html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
