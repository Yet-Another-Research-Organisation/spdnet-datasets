name: Lint

# Ruff (rules and version settings in pyproject.toml, [tool.ruff]).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --output-format=github"
          src: "src tests examples doc/tools"
