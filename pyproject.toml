[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spdnet-datasets"
version = "0.1.0"
description = "Dataset loaders, covariance estimators, and synthetic data generators for SPDNet research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Matthieu Gallet"},
    {name = "Ammar Mian", email = "ammar.mian@univ-smb.fr"},
]
keywords = ["deep-learning", "spd-matrices", "datasets", "covariance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "tifffile>=2021.0.0",
    "spectral>=0.22.0",
    "h5py>=3.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-cov>=3.0.0"]
synthetic = ["yetanotherspdnet"]
# Tyler and Student-t estimators (yetanotherspdnet.functions.m_estimators)
robust = ["yetanotherspdnet"]
audio = ["pyarrow>=12.0", "soundfile>=0.12"]
sits = ["geopandas>=0.14"]
# S1SLC_CVDL is a zarr v3 store; MSTAR / AIR-PolSAR-Seg read jpg / png with Pillow
sar = ["zarr>=3.0", "rasterio>=1.3", "Pillow>=9.0"]
# CI4R spectrograms are PNG images
radar = ["Pillow>=9.0"]
# MOABB adapter (spdnet_datasets.moabb), tested with moabb 1.7.2
moabb = ["moabb>=1.7.2"]
dev = ["ruff>=0.1.0", "pre-commit>=3.4.0"]
docs = ["sphinx>=7.2.0", "myst-parser>=2.0.0", "furo>=2024.8.6", "sphinx-copybutton>=0.5.0"]

[project.urls]
Repository = "https://github.com/Yet-Another-Research-Organisation/spdnet-datasets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: needs the datasets under $SPDNET_DATA_ROOT (skipped when absent)",
    "slow: long test (real downloads, full datasets)",
    "network: needs Internet access",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
